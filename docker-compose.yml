name: jenie

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jenie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-jenie}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jenie} -d ${POSTGRES_DB:-jenie}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]

  # Local AWS emulator. The Terraform in infra/ applies against this in CI,
  # which is why the pipeline needs no AWS credentials.
  floci:
    image: floci/floci:latest
    environment:
      SERVICES: s3,sqs,secretsmanager,iam,sts,ecr,ecs,rds,logs,cloudwatch
    ports: ["4566:4566"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c",
              "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./data:/data:ro
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports: ["3000:3000"]

volumes:
  pgdata:
