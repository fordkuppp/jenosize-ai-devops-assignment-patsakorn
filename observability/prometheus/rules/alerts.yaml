# Alerts exist to protect a stated objective. Each rule below names the SLO it
# defends — an alert without one is just a number somebody picked.
#
# SLOs for this service:
#   availability : 99% of /ask requests succeed, measured over 30 days
#   latency      : 95% of /ask requests complete within 3s
#   retrieval    : 95% of retrievals complete within 250ms

groups:
  - name: jenie-slo
    rules:
      - alert: AskErrorRateHigh
        expr: |
          sum(rate(http_requests_total{handler="/ask",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{handler="/ask"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "/ask error rate above 5% for 5m"
          description: >
            Burning the 99% availability objective. Check rag_ask_errors_total
            by stage to see whether retrieval or the model backend is failing.

      - alert: AskLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{handler="/ask"}[5m])) by (le)
          ) > 3
        for: 10m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "/ask p95 above the 3s objective"
          description: >
            Compare rag_retrieval_duration_seconds against
            rag_generation_duration_seconds — they are split precisely so this
            question is answerable without a profiler.

      - alert: RetrievalLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(rag_retrieval_duration_seconds_bucket[5m])) by (le)
          ) > 0.25
        for: 10m
        labels:
          severity: warning
          slo: retrieval
        annotations:
          summary: "Vector search p95 above 250ms"
          description: >
            Usually the HNSW index missing after a reindex, or the candidate
            pool (RETRIEVAL_CANDIDATES) set too wide.

      - alert: NoIndexedDocuments
        expr: rag_indexed_documents_total == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Vector store is empty"
          description: >
            /ask will answer from nothing. The indexer job has not run, or ran
            against an empty DATA_DIR.
