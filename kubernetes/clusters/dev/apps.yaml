---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  # dev deploys with RollingUpdate, so a healthy apply finishes in well under
  # a minute. Anything longer is a stuck resource, and with wait: true this
  # timeout is also how long a fix in git stays unreachable — see the note on
  # infra-controllers. prod keeps a longer one because its canary analysis
  # legitimately runs for minutes.
  timeout: 5m
  path: ./kubernetes/apps/jenie/overlays/dev
  prune: true
  wait: true
  # A Job's spec.template is immutable. The indexer is a Job, and image
  # automation exists precisely to change its tag — so without this the first
  # tag bump fails with `field is immutable` and reconciliation is stuck for
  # good. force lets Flux delete and recreate on immutable-field conflicts,
  # which for an indexing job is also the behaviour you want.
  force: true
  sourceRef:
    kind: GitRepository
    name: flux2-sync
  # SOPS-encrypted manifests are decrypted with the age key Terraform seeded.
  # Nothing in this repo is encrypted yet; wiring it now means the first
  # secret added does not also require a Flux change.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
