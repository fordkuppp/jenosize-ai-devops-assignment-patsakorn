# Three Kustomizations with an explicit dependency chain, rather than one.
# Controllers must be Ready before their CRDs exist; configs (GatewayClass,
# Gateway) are CRs of those CRDs; apps depend on both. Flux will not retry its
# way out of a wrong order — dependsOn is what makes a cold start work.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  # Short on purpose. With wait: true, kustomize-controller will not start a
  # new reconciliation until the in-flight one finishes, so this timeout is
  # also how long a fix in git stays unreachable after a controller gets
  # stuck. At 15m a one-line correction could not land for a quarter of an
  # hour; the cluster was not broken, it was holding the lock.
  timeout: 5m
  path: ./kubernetes/infrastructure/controllers/overlays/prod
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux2-sync
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  timeout: 10m
  path: ./kubernetes/infrastructure/configs
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux2-sync
