# Deliberately its own Kustomization rather than part of the app overlay.
#
# Image automation needs a write-scoped deploy key that bootstrap-secrets only
# creates when one is supplied. Without it the SSH GitRepository fails — and
# when these resources sat inside the apps overlay, which has wait: true, that
# failure blocked the entire application from reconciling. Optional
# infrastructure that can take a required deliverable down with it is a
# coupling bug, not a missing credential.
#
# wait: false, so an unconfigured automation reports unhealthy on its own and
# nothing else notices.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  dependsOn:
    - name: apps
  interval: 10m
  timeout: 5m
  path: ./kubernetes/apps/jenie/image-automation
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux2-sync
