---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flagger-system
spec:
  interval: 30m
  # Flagger queries Prometheus for canary analysis. It installs without it,
  # but a canary started before Prometheus exists stalls with no metrics —
  # the silent failure mode, so order it explicitly.
  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring
  chart:
    spec:
      chart: flagger
      version: "1.45.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
  install:
    crds: Create
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
  values:
    meshProvider: gatewayapi:v1
    # prometheus-operated is the headless Service the Prometheus Operator
    # always creates, independent of the kube-prometheus-stack release name.
    # Pointing at the release-named Service would break on a rename.
    metricsServer: http://prometheus-operated.monitoring.svc:9090
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger-loadtester
  namespace: flagger-system
spec:
  interval: 30m
  chart:
    spec:
      chart: loadtester
      version: "0.39.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
  # Not optional. Canary analysis evaluates metrics over a window; with no
  # traffic there are no samples, so the rollout neither passes nor fails — it
  # stalls until progressDeadlineSeconds, blocking every later deploy.
  values:
    cmd:
      timeout: 1h
