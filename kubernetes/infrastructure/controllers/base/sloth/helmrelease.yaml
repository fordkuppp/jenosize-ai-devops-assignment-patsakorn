---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sloth
  namespace: sloth
spec:
  interval: 30m
  # The chart renders a PodMonitor, so monitoring.coreos.com must already be
  # served. Without this it fails with "no matches for kind PodMonitor" —
  # which reads like a chart bug and is actually an ordering bug.
  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring
  chart:
    spec:
      # Vendored, not fetched: upstream publishes this chart only as a GitHub
      # release asset, which is unreachable from some networks, and it has no
      # OCI mirror. With wait: true on infra-controllers that made one flaky
      # download capable of taking the whole cluster down — see
      # kubernetes/charts/sloth/VENDORED.md.
      chart: ./kubernetes/charts/sloth
      sourceRef:
        kind: GitRepository
        name: flux2-sync
        namespace: flux-system
  install:
    crds: Create
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
  values:
    # Watches PrometheusServiceLevel in every namespace and emits a
    # PrometheusRule next to each one.
    sloth:
      labelSelector: ""
