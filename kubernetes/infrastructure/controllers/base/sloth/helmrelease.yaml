---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sloth
  namespace: sloth
spec:
  interval: 30m
  chart:
    spec:
      chart: sloth
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: sloth
        namespace: flux-system
  install:
    crds: Create
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
  values:
    # Watches PrometheusServiceLevel in every namespace and emits a
    # PrometheusRule next to each one.
    sloth:
      labelSelector: ""
