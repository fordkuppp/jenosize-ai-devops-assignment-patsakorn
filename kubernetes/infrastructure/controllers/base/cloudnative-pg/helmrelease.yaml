---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 30m
  # podMonitorEnabled below renders a PodMonitor. Same CRD ordering problem.
  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  install:
    crds: Create
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
  values:
    monitoring:
      podMonitorEnabled: true
      # The operator ships a rule set for the one stateful component in the
      # stack — cluster offline, replication lag, connection saturation, low
      # disk. Free coverage; the only cost is turning it on.
      grafanaDashboard:
        create: false
