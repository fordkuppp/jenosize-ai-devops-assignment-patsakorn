---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m
  chart:
    spec:
      chart: gateway-helm
      version: "1.10.0"
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
        namespace: flux-system
  install:
    crds: Create
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
  values:
    deployment:
      replicas: 1
