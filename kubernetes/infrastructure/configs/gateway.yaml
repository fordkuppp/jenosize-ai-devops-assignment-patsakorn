# Gateway API separates three roles, and the names here follow them:
#
#   GatewayClass  infrastructure provider  — a *class* of service, cluster-scoped
#   Gateway       cluster operator         — a listener a team can attach to
#   HTTPRoute     application developer    — lives with the app, names the app
#
# Nothing above the HTTPRoute mentions jenie. A second service joining the
# platform attaches to the same Gateway and needs no change here.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: default
    namespace: envoy-gateway-system
---
# Named for the traffic tier, not the tenant. An `internal` Gateway for
# east-west or admin traffic would sit beside this one using the same class.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Routes attach from tenant namespaces. In a real multi-tenant
          # cluster this becomes `Selector` on a label the platform grants,
          # so a namespace cannot attach itself without being admitted.
          from: All
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: default
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # kind has no load balancer, so the data plane is reached through a
        # fixed NodePort that the cluster's extraPortMappings forward to.
        # This is the one genuinely environment-specific thing in this file:
        # on a real cluster it is `type: LoadBalancer` and nothing else here
        # changes.
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                # TODO(verify): Envoy Gateway derives the port name from the
                # listener as "<protocol>-<port>". Confirm against
                # `kubectl -n envoy-gateway-system get svc -o yaml` on first
                # apply — a name mismatch makes this patch a no-op and leaves
                # the NodePort random, which fails silently.
                - name: http-80
                  nodePort: 30080
  telemetry:
    metrics:
      # Flagger's built-in request-success-rate and request-duration read
      # Envoy's metrics, not the application's. Without this the canary has
      # nothing to evaluate and stalls instead of failing.
      prometheus: {}
