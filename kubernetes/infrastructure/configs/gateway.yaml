---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: jenie
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: jenie-proxy
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: jenie
  namespace: envoy-gateway-system
spec:
  gatewayClassName: jenie
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Routes are attached from the app namespace, so the gateway has to
          # accept them from elsewhere. In a multi-tenant cluster this would be
          # `Selector` with a label, not `All`.
          from: All
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: jenie-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # kind has no load balancer. A NodePort with a fixed port is what the
        # cluster's extraPortMappings forward the host port to, so the number
        # here and the number in infrastructure/terraform must agree.
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                # TODO(verify): Envoy Gateway derives the port name from the
                # listener as "<protocol>-<port>". Confirm with
                # `kubectl -n envoy-gateway-system get svc -o yaml` on first
                # apply; a name mismatch means the patch silently does nothing
                # and the NodePort stays random.
                - name: http-80
                  nodePort: 30080
  telemetry:
    metrics:
      # Flagger's built-in request-success-rate and request-duration query
      # Envoy's own metrics, not the application's. Without this the canary
      # has nothing to evaluate and stalls rather than failing.
      prometheus: {}
