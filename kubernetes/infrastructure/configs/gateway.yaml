# Gateway API separates three roles, and the names here follow them:
#
#   GatewayClass  infrastructure provider  — a *class* of service, cluster-scoped
#   Gateway       cluster operator         — a listener a team can attach to
#   HTTPRoute     application developer    — lives with the app, names the app
#
# Nothing above the HTTPRoute mentions jenie. A second service joining the
# platform attaches to the same Gateway and needs no change here.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: default
    namespace: envoy-gateway-system
---
# Named for the traffic tier, not the tenant. An `internal` Gateway for
# east-west or admin traffic would sit beside this one using the same class.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Routes attach from tenant namespaces. In a real multi-tenant
          # cluster this becomes `Selector` on a label the platform grants,
          # so a namespace cannot attach itself without being admitted.
          from: All
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: default
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # kind has no load balancer, so the data plane is reached through a
        # fixed NodePort that the cluster's extraPortMappings forward to.
        # This is the one genuinely environment-specific thing in this file:
        # on a real cluster it is `type: LoadBalancer` and nothing else here
        # changes.
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              # Envoy Gateway defaults this to Local to preserve client IPs.
              # In kind that silently breaks the data plane: with Local, a node
              # only answers the NodePort if it hosts an endpoint, and the host
              # port mappings live on the control-plane while the proxy pod is
              # scheduled on a worker. Packets arrive at a node with no local
              # endpoint and are dropped — a timeout, not a refusal, so it
              # looks like a networking problem rather than a policy one.
              # Client IP preservation is meaningless behind a kind port map.
              externalTrafficPolicy: Cluster
              ports:
                # A Service's ports list declares `port` as its strategic
                # merge key, so an entry without it cannot be matched to the
                # generated port and Envoy Gateway rejects the whole service:
                #   does not contain declared merge key: port
                # The value must equal the Gateway listener's port above.
                - port: 80
                  nodePort: 30080
  telemetry:
    metrics:
      # Flagger's built-in request-success-rate and request-duration read
      # Envoy's metrics, not the application's. Without this the canary has
      # nothing to evaluate and stalls instead of failing.
      prometheus: {}
