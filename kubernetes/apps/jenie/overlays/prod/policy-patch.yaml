# prod is where progressive delivery earns its keep: a canary gated on both
# Envoy's view (did it return errors) and the application's (did it stop
# answering, did it get more expensive).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jenie-api-policy
  namespace: jenie
spec:
  values:
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
    podDisruption:
      enabled: true
      minAvailable: 1
    strategy:
      type: Canary
      canary:
        stepWeight: 20
        maxWeight: 60
        stepWeightPromotion: 100
      analysis:
        interval: 30s
        threshold: 3
        # templateRef is required for anything that is not a Flagger
        # built-in. Without it Flagger resolves the name against its own
        # built-ins, finds nothing, and fails the check with "no usable
        # metrics template and query were configured" — a custom gate that
        # looks configured and is inert.
        metrics:
          - name: canary-success-rate
            templateRef:
              name: canary-success-rate
              namespace: jenie
            thresholdRange: { min: 99 }
            interval: 1m
          - name: canary-latency-p95
            templateRef:
              name: canary-latency-p95
              namespace: jenie
            thresholdRange: { max: 3 }
            interval: 1m
          # The AI-aware gate. A release that starts refusing questions it
          # used to answer returns 200s, quickly — invisible to both metrics
          # above. This is the one that catches a bad prompt or a broken
          # index, and no HTTP signal can.
          - name: rag-refusal-rate
            templateRef:
              name: rag-refusal-rate
              namespace: jenie
            thresholdRange: { max: 40 }
            interval: 1m
      metricTemplates:
        # Scoped to the canary pods by name. Envoy cannot distinguish the
        # two backends — Envoy Gateway emits one cluster per HTTPRoute rule
        # — so the gates read the application's own metrics instead.
        #
        # The canary is the ORIGINAL Deployment: Flagger builds a separate
        # <target>-primary for the stable version and leaves the original
        # carrying the new one. So canary pods are "<target>-<hash>-<id>"
        # and the filter is "starts with target, is not -primary". There is
        # no "<target>-canary" Deployment, only a Service of that name.
        - name: canary-success-rate
          query: |
            100 * (
              sum(rate(http_requests_total{namespace="{{ namespace }}",pod=~"{{ target }}-.*",pod!~"{{ target }}-primary-.*",status!~"5.."}[{{ interval }}]))
              /
              clamp_min(sum(rate(http_requests_total{namespace="{{ namespace }}",pod=~"{{ target }}-.*",pod!~"{{ target }}-primary-.*"}[{{ interval }}])), 0.001)
            )
        - name: canary-latency-p95
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ namespace }}",pod=~"{{ target }}-.*",pod!~"{{ target }}-primary-.*"}[{{ interval }}]))
            )
        - name: rag-refusal-rate
          query: |
            100 * (
              sum(rate(rag_answers_total{namespace="{{ namespace }}",pod=~"{{ target }}-.*",pod!~"{{ target }}-primary-.*",outcome="refused"}[{{ interval }}]))
              /
              clamp_min(sum(rate(rag_answers_total{namespace="{{ namespace }}",pod=~"{{ target }}-.*",pod!~"{{ target }}-primary-.*"}[{{ interval }}])), 0.001)
            )
