# prod is where progressive delivery earns its keep: a canary gated on both
# Envoy's view (did it return errors) and the application's (did it stop
# answering, did it get more expensive).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jenie-api-policy
  namespace: jenie
spec:
  values:
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
    podDisruption:
      enabled: true
      minAvailable: 1
    strategy:
      type: Canary
      canary:
        stepWeight: 20
        maxWeight: 60
        stepWeightPromotion: 100
      analysis:
        # 1m, not 30s. Flagger starts judging one interval in, while the
        # canary pod is still warming and its metric series does not exist
        # yet — rate() needs two scrapes in its window before it returns
        # anything. Checking faster than the data arrives just fails sooner.
        interval: 1m
        threshold: 5
        # templateRef is required for anything that is not a Flagger
        # built-in. Without it Flagger resolves the name against its own
        # built-ins, finds nothing, and fails the check with "no usable
        # metrics template and query were configured" — a custom gate that
        # looks configured and is inert.
        metrics:
          - name: canary-success-rate
            templateRef:
              name: canary-success-rate
              namespace: jenie
            thresholdRange: { min: 99 }
            interval: 1m
          - name: canary-latency-p95
            templateRef:
              name: canary-latency-p95
              namespace: jenie
            thresholdRange: { max: 3 }
            interval: 1m
          # The AI-aware gate. A release that starts refusing questions it
          # used to answer returns 200s, quickly — invisible to both metrics
          # above. This is the one that catches a bad prompt or a broken
          # index, and no HTTP signal can.
          - name: rag-refusal-rate
            templateRef:
              name: rag-refusal-rate
              namespace: jenie
            thresholdRange: { max: 40 }
            interval: 1m
      metricTemplates:
        # Scoped to the canary pods by name. Envoy cannot distinguish the
        # two backends — Envoy Gateway emits one cluster per HTTPRoute rule
        # — so the gates read the application's own metrics instead.
        #
        # `or vector(...)` on every query: absent data is NOT failure.
        #
        # A canary pod lives about two minutes, its metric series only
        # exists after the first request, and rate() needs two scrapes.
        # Flagger counts an empty result as a failed check, so without a
        # fallback a healthy release is rolled back during warm-up — which
        # happened five times before this. The fallback is the "no traffic
        # yet" value for each gate, so they only fail on evidence.
        #
        # The canary is the ORIGINAL Deployment: Flagger builds a separate
        # <target>-primary for the stable version and leaves the original
        # carrying the new one. So canary pods are "<target>-<hash>-<id>"
        # and the filter is "starts with target, is not -primary". There is
        # no "<target>-canary" Deployment, only a Service of that name.
        #
        # No clamp_min here, deliberately. Clamping the denominator turns
        # "no requests at all" into a real 0/0.001 = 0, and a genuine zero
        # is not absent data — so `or vector(100)` never fires and the gate
        # reports 0% success. Pods that have just been replaced keep flat
        # series for Prometheus' five-minute staleness window, so this fires
        # on every rollout, not just the first. The `and` guard yields an
        # empty result when there is no traffic, which is what lets the
        # fallback do its job; it also drops the 0/0 NaN.
        - name: canary-success-rate
          query: |
            (
              100 * (
                sum(rate(http_requests_total{namespace="{{ namespace }}",pod=~"{{ target }}-.*",pod!~"{{ target }}-primary-.*",status!~"5.."}[{{ interval }}]))
                /
                sum(rate(http_requests_total{namespace="{{ namespace }}",pod=~"{{ target }}-.*",pod!~"{{ target }}-primary-.*"}[{{ interval }}]))
              )
              and
              sum(rate(http_requests_total{namespace="{{ namespace }}",pod=~"{{ target }}-.*",pod!~"{{ target }}-primary-.*"}[{{ interval }}])) > 0
            )
            or vector(100)
        - name: canary-latency-p95
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ namespace }}",pod=~"{{ target }}-.*",pod!~"{{ target }}-primary-.*"}[{{ interval }}]))
            )
            or vector(0)
        - name: rag-refusal-rate
          query: |
            100 * (
              sum(rate(rag_answers_total{namespace="{{ namespace }}",pod=~"{{ target }}-.*",pod!~"{{ target }}-primary-.*",outcome="refused"}[{{ interval }}]))
              /
              clamp_min(sum(rate(rag_answers_total{namespace="{{ namespace }}",pod=~"{{ target }}-.*",pod!~"{{ target }}-primary-.*"}[{{ interval }}])), 0.001)
            )
            or vector(0)
