apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jenie
resources:
  - ../../base
patches:
  - path: policy-patch.yaml
  - target:
      kind: ObjectStore
      name: jenie-backups
    patch: |-
      - op: replace
        path: /spec/retentionPolicy
        value: 30d
  - path: postgres-patch.yaml
  - target:
      kind: Deployment
      name: jenie-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
