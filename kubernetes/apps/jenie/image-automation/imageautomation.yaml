# The only write credential in the system.
#
# Reconciliation reads the repo over public HTTPS with no credential at all.
# Only this path needs a key, and it is a repo-scoped deploy key rather than a
# user PAT: its blast radius is one repository, it cannot read any other, and
# revoking it breaks nothing but automated tag bumps.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: jenie-push
  namespace: flux-system
spec:
  interval: 10m
  url: ssh://git@github.com/fordkuppp/jenosize-ai-devops-assignment-patsakorn.git
  ref:
    branch: main
  secretRef:
    name: flux-image-automation
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: jenie-api
  namespace: flux-system
spec:
  image: ghcr.io/fordkuppp/jenie-api
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: jenie-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: jenie-api
  # Semver would be wrong here: CI tags by build, not by release. The filter
  # extracts the build timestamp and orders numerically, so "newest" means
  # most recently built rather than alphabetically largest hex string.
  filterTags:
    pattern: '^main-(?P<ts>\d+)-[a-f0-9]+$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: jenie-indexer
  namespace: flux-system
spec:
  image: ghcr.io/fordkuppp/jenie-indexer
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: jenie-indexer
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: jenie-indexer
  filterTags:
    pattern: '^main-(?P<ts>\d+)-[a-f0-9]+$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: jenie
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: jenie-push
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(deploy): {{ range .Changed.Changes }}{{ .OldValue }} -> {{ .NewValue }} {{ end }}
    push:
      branch: main
  update:
    path: ./kubernetes/apps/jenie
    strategy: Setters
