# The only write credential in the system.
#
# Reconciliation reads the repo over public HTTPS with no credential at all.
# Only this path needs a key, and it is a repo-scoped deploy key rather than a
# user PAT: its blast radius is one repository, it cannot read any other, and
# revoking it breaks nothing but automated tag bumps.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: jenie-push
  namespace: flux-system
spec:
  interval: 10m
  url: ssh://git@github.com/fordkuppp/jenosize-ai-devops-assignment-patsakorn.git
  ref:
    branch: main
  secretRef:
    name: flux-image-automation
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: jenie-api
  namespace: flux-system
spec:
  # PLACEHOLDER, tracking the same image api.yaml runs. Pointing this at an
  # image that does not exist yet would make automation permanently unhealthy
  # and prove nothing; against podinfo the whole loop is observable — policy
  # picks the newest semver, automation commits the tag back to git, Flux
  # deploys it.
  image: ghcr.io/stefanprodan/podinfo
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: jenie-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: jenie-api
  policy:
    semver:
      range: ">=6.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: jenie-indexer
  namespace: flux-system
spec:
  # PLACEHOLDER — see above.
  image: docker.io/library/busybox
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: jenie-indexer
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: jenie-indexer
  policy:
    semver:
      range: ">=1.36.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: jenie
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: jenie-push
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(deploy): {{ range .Changed.Changes }}{{ .OldValue }} -> {{ .NewValue }} {{ end }}
    push:
      branch: main
  update:
    path: ./kubernetes/apps/jenie
    strategy: Setters
