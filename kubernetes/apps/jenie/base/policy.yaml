---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jenie-api-policy
  namespace: jenie
spec:
  interval: 30m
  chart:
    spec:
      # Path is relative to the repo root, not to this file. The chart lives
      # under kubernetes/ but no Kustomization points at kubernetes/charts,
      # so Flux never tries to apply it as manifests — only helm-controller
      # reads it, through this reference.
      chart: ./kubernetes/charts/service-policy
      # Track the git revision, not the chart version. The default for a
      # GitRepository source is Revision=ChartVersion, so editing a chart
      # without bumping Chart.yaml produces no new artifact and the fix is
      # never pulled — the release sits on stale content while git looks
      # correct. Bumping the version is still good practice; this makes
      # forgetting it harmless rather than silently broken.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux2-sync
        namespace: flux-system
  install:
    remediation: { retries: 3 }
  upgrade:
    # A second safety net underneath Flagger: if the release itself fails to
    # apply, Helm reverts it. Flagger handles the case where it applies fine
    # and then behaves badly.
    remediation:
      retries: 3
      strategy: rollback
  values:
    target:
      kind: Deployment
      name: jenie-api
      service:
        port: 8000
        targetPort: http
      # Not app.kubernetes.io/name — Flagger rewrites that one. See the
      # chart values for why.
      selector:
        app.kubernetes.io/part-of: jenie
    route:
      enabled: true
      gateway:
        name: external
        namespace: envoy-gateway-system
        sectionName: http
    networkPolicy:
      enabled: true
      allowFrom:
        - namespace: envoy-gateway-system
        - namespace: monitoring
        # The canary load generator. Without it the NetworkPolicy denies
        # the only traffic the release gates can observe.
        - namespace: flagger-system
      allowTo:
        - podSelector:
            cnpg.io/cluster: jenie-pg
          ports: [5432]
    strategy:
      type: RollingUpdate
