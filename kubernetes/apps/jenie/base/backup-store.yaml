# The backup target.
#
# SeaweedFS rather than MinIO: MinIO has restricted its community images and
# they no longer pull anonymously, which is its own argument about depending
# on a vendor's goodwill for a disaster-recovery component.
#
# Scoped to this service's namespace on purpose. On a real platform the object
# store is shared infrastructure with a bucket and credential per tenant; here
# one service owns its own, which is simpler and happens to be the stronger
# security posture — a leaked credential reaches one service's backups.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenie-backup-store
  namespace: jenie
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jenie-backup-store
  namespace: jenie
  labels:
    app.kubernetes.io/name: jenie-backup-store
spec:
  selector:
    app.kubernetes.io/name: jenie-backup-store
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenie-backup-store
  namespace: jenie
  labels:
    app.kubernetes.io/name: jenie-backup-store
spec:
  replicas: 1
  strategy:
    # The PVC is ReadWriteOnce, so two replicas cannot both mount it and a
    # rolling update would deadlock on the old pod holding the volume.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jenie-backup-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenie-backup-store
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=256
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jenie-backup-store
        - name: config
          secret:
            secretName: jenie-backup-store
            items:
              - key: s3.json
                path: s3.json
---
# barman-cloud expects the bucket to exist; it will not create it.
apiVersion: batch/v1
kind: Job
metadata:
  name: jenie-backup-bucket
  namespace: jenie
  annotations:
    # Re-runs on every change rather than being a one-shot that silently
    # never repeats after the store is recreated.
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-bucket
          image: amazon/aws-cli:2.31.14
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: jenie-backup-store, key: ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: jenie-backup-store, key: SECRET_ACCESS_KEY }
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - sh
            - -c
            - |
              set -e
              until aws --endpoint-url http://jenie-backup-store:8333 s3api list-buckets >/dev/null 2>&1; do
                echo "waiting for the object store..."; sleep 3
              done
              aws --endpoint-url http://jenie-backup-store:8333 \
                  s3api create-bucket --bucket jenie-backups 2>/dev/null \
                || echo "bucket already exists"
              aws --endpoint-url http://jenie-backup-store:8333 s3 ls
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
