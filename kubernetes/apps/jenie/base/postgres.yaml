---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: jenie-pg
  namespace: jenie
spec:
  instances: 1
  # Stock CNPG images do not ship pgvector, so this is built from one.
  # See infrastructure/images/postgres-pgvector/Dockerfile.
  imageName: ghcr.io/fordkuppp/postgres-pgvector:17
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: jenie
      owner: jenie
      # postInitApplicationSQL, NOT postInitSQL.
      #
      # CNPG runs postInitSQL against the `postgres` database and
      # postInitApplicationSQL against the application database. Using the
      # first creates the extension somewhere the application never connects,
      # and the failure surfaces much later as `type "vector" does not exist`
      # — which looks like a broken image rather than a misplaced hook.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  # CNPG generates and rotates the credentials and publishes them as
  # <cluster>-app. Terraform deliberately does not create a database password:
  # two sources of truth for one secret is how they drift.
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      max_connections: "100"
