---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenie-api
  namespace: jenie
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: jenie-api
  namespace: jenie
  labels:
    app.kubernetes.io/name: jenie-api
spec:
  selector:
    app.kubernetes.io/name: jenie-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenie-api
  namespace: jenie
  labels:
    app.kubernetes.io/name: jenie-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jenie-api
  strategy:
    # Governs how the -primary Deployment itself rolls once a canary is
    # promoted. Not an alternative to the canary — the inner mechanism of it.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenie-api
    spec:
      serviceAccountName: jenie-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/fordkuppp/jenie-api:v0.1.0 # {"$imagepolicy": "flux-system:jenie-api"}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: jenie-config
          env:
            - name: PGHOST
              value: jenie-pg-rw
            - name: PGDATABASE
              value: jenie
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: jenie-pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenie-pg-app
                  key: password
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness deliberately does not check the database. A dependency
          # check here turns one Postgres blip into a simultaneous restart of
          # every replica; readiness is where dependencies belong.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          lifecycle:
            # Lets the gateway stop routing before the process stops
            # accepting. Without it every rollout drops in-flight requests.
            preStop:
              exec: { command: ["sleep", "5"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
