---
apiVersion: batch/v1
kind: Job
metadata:
  name: jenie-indexer
  namespace: jenie
  labels:
    app.kubernetes.io/name: jenie-indexer
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenie-indexer
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: ghcr.io/fordpatsakorn/jenie-indexer:v0.1.0 # {"$imagepolicy": "flux-system:jenie-indexer"}
          envFrom:
            - configMapRef:
                name: jenie-config
          env:
            - name: PGHOST
              value: jenie-pg-rw
            - name: PGDATABASE
              value: jenie
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: jenie-pg-app, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: jenie-pg-app, key: password }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
