---
apiVersion: batch/v1
kind: Job
metadata:
  name: jenie-indexer
  namespace: jenie
  labels:
    app.kubernetes.io/name: jenie-indexer
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenie-indexer
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          # PLACEHOLDER — see api.yaml. Runs to completion so the Job
          # succeeds and the apps Kustomization can go Ready; the real
          # indexer chunks, embeds and upserts into pgvector.
          #   image: ghcr.io/fordkuppp/jenie-indexer:v0.1.0 # {"$imagepolicy": "flux-system:jenie-indexer"}
          image: busybox:1.37 # {"$imagepolicy": "flux-system:jenie-indexer"}
          command:
            - sh
            - -c
            - |
              echo "placeholder indexer"
              echo "  would read data/*.md, chunk, embed, upsert into pgvector"
              echo "  PGHOST=$PGHOST PGDATABASE=$PGDATABASE"
              sleep 3
              echo "done"
          envFrom:
            - configMapRef:
                name: jenie-config
          env:
            - name: PGHOST
              value: jenie-pg-rw
            - name: PGDATABASE
              value: jenie
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: jenie-pg-app, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: jenie-pg-app, key: password }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
