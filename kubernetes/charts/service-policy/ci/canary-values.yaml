# Progressive delivery with an app-supplied metric template and an HPA,
# which together exercise the autoscalerRef wiring.
target:
  name: jenie-api
  service:
    port: 8000
    targetPort: http
  selector:
    app.kubernetes.io/name: jenie-api
route:
  gateway:
    name: external
    namespace: envoy-gateway-system
  hostnames:
    - jenie.local
strategy:
  type: Canary
  analysis:
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99
        interval: 1m
      - name: rag-refusal-rate
        thresholdRange:
          max: 40
        interval: 1m
  metricTemplates:
    # Uses Flagger's {{ interval }} placeholder on purpose: a fixture that
    # avoids it cannot catch the chart templating over it.
    - name: rag-refusal-rate
      query: |
        sum(rate(rag_answers_total{outcome="refused"}[{{ interval }}]))
          / sum(rate(rag_answers_total[{{ interval }}])) * 100
autoscaling:
  enabled: true
podDisruption:
  enabled: true
networkPolicy:
  enabled: true
  allowTo:
    - podSelector:
        cnpg.io/cluster: jenie-pg
      ports: [5432]
