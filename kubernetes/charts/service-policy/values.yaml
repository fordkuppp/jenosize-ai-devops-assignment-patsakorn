# service-policy — the platform layer for services on the paved road.
#
# This chart owns NO workload. Deployments, Pods, Services, ConfigMaps and
# Secrets come from app-template or plain manifests, which already do that job
# well and have had years of design iteration. Rebuilding them adds nothing.
#
# What has no paved road is the layer above the pod: routing, traffic policy,
# progressive delivery, and SLO-backed alerting. A new service at Jenosize
# needs all four on day one, and today each team invents them. That is the
# entire scope of this chart.
#
# Consequence: there is no `podTemplate` here, and no asymmetry between a
# Deployment and a Job — the chart never sees either. It takes a reference.


nameOverride: ""
fullnameOverride: ""


# ─────────────────────────────────────────────────────────────────────────────
# target — the single input. Everything else is policy applied to this.
# ─────────────────────────────────────────────────────────────────────────────
target:
  # The workload Flagger drives and the HPA scales.
  kind: Deployment          # Deployment | StatefulSet | DaemonSet
  name: ""                  # required

  # The Service in front of it. Under a non-rolling strategy Flagger derives
  # -primary and -canary from this spec and takes ownership of the apex.
  service:
    name: ""                # defaults to target.name
    port: 8000
    targetPort: http

  # Pod labels for NetworkPolicy, PodDisruptionBudget and the PodMonitor.
  # These select pods directly rather than through the workload.
  #
  # It must NOT be the label in the Deployment's spec.selector. Flagger
  # creates a <target>-primary Deployment whose selector label is
  # <original>-primary and keeps the original Deployment as the canary, so
  # a selector on the original label covers only the canary — which is
  # scaled to zero at rest. A NetworkPolicy matching zero pods denies
  # nothing, a PDB protects nothing, a PodMonitor scrapes nothing, and all
  # three report healthy while doing so.
  selector: {}
    # app.kubernetes.io/part-of: jenie


# ─────────────────────────────────────────────────────────────────────────────
# Routing — Gateway API. Ingress is retired (SIG Network, March 2026), so
# HTTPRoute is the only forward-looking option here.
#
# NOTE: rendered ONLY when strategy.type == RollingUpdate. Under any Flagger
# strategy the Canary owns the HTTPRoute and rewrites backendRef weights on
# every analysis step; a Helm-managed route would fight it indefinitely.
# ─────────────────────────────────────────────────────────────────────────────
route:
  enabled: true
  gateway:
    name: external
    namespace: envoy-gateway-system
    sectionName: http
  hostnames: []
  path: /
  timeouts:
    # LLM generation routinely exceeds Envoy's default, and the failure shows
    # up as 504s that look like application errors.
    request: 30s
    backendRequest: 30s


# ─────────────────────────────────────────────────────────────────────────────
# Traffic policy — Envoy Gateway BackendTrafficPolicy.
#
# Rate limiting as typed, schema-validated config rather than an annotation
# string. This is the chart's answer to the "rate limiting" requirement.
# ─────────────────────────────────────────────────────────────────────────────
rateLimit:
  enabled: true
  type: Local               # Local (per-proxy) | Global (needs a rate-limit svc)
  requests: 60
  unit: Minute

circuitBreaker:
  enabled: true
  maxParallelRequests: 100
  maxPendingRequests: 50

retry:
  enabled: false
  numRetries: 2
  retryOn: ["5xx", "reset"]


# ─────────────────────────────────────────────────────────────────────────────
# Network policy — default-deny, then explicit allows.
# ─────────────────────────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
  allowDNS: true
  allowFrom:
    - namespace: envoy-gateway-system
    - namespace: monitoring
    # Progressive delivery needs synthetic traffic during analysis, and the
    # load tester lives in the mesh controller's namespace. Omit this and a
    # correctly-configured canary still halts on "no values found" — the
    # policy denies the only traffic the gates can measure.
    - namespace: flagger-system
  # Egress is default-deny once this is enabled, so every dependency has to
  # be named. Example shape only — the consuming release supplies its own.
  allowTo: []
    # - podSelector: {app.kubernetes.io/name: some-database}
    #   ports: [5432]


# ─────────────────────────────────────────────────────────────────────────────
# Progressive delivery — Flagger.
#
# `rollingUpdate` is not an alternative to the other types. It lives on the
# workload and always applies; it governs how the primary itself rolls once a
# canary is promoted. `type` only decides whether a Canary wraps that inner
# mechanism. (Set it on the workload chart, not here — noted for the reader.)
# ─────────────────────────────────────────────────────────────────────────────
strategy:
  type: RollingUpdate       # RollingUpdate | Canary | BlueGreen | ABTest

  canary:
    stepWeight: 10
    maxWeight: 50
    stepWeightPromotion: 100

  blueGreen:
    iterations: 10
    mirror: false           # shadow live traffic at 0% exposure

  abTest:
    iterations: 10
    match:
      - headers:
          x-canary:
            exact: "true"

  # Shared by Canary / BlueGreen / ABTest — only the traffic mechanics above
  # differ, so this is a sibling rather than three copies of one schema.
  analysis:
    interval: 30s
    threshold: 5            # failed checks before automatic rollback
    progressDeadlineSeconds: 600

    # Not Flagger's built-in request-success-rate / request-duration.
    #
    # Those query Envoy, and Envoy Gateway emits one cluster per HTTPRoute
    # *rule* — "httproute/<ns>/<route>/rule/0" — not one per backendRef. So
    # there is no canary-specific Envoy series to measure, and the built-ins
    # halt with "no values found" until the failure threshold rolls a
    # perfectly good release back. Observed, not theorised.
    #
    # The application's own metrics can distinguish canary pods by name, so
    # the consuming release supplies templates that do. Chart default is
    # empty: a gate that cannot see the canary is worse than no gate.
    # Each entry needs a templateRef unless it is a Flagger built-in.
    # Without one Flagger looks the name up among its built-ins, does not
    # find it, and fails the check — the gate looks configured and does
    # nothing. Example:
    #
    #   - name: canary-success-rate
    #     templateRef: {name: canary-success-rate, namespace: jenie}
    #     thresholdRange: {min: 99}
    #     interval: 1m
    metrics: []

    # Mandatory, not optional. With no synthetic traffic during analysis there
    # are no samples to evaluate, so the canary stalls silently rather than
    # failing — the worst possible failure mode to debug on a deadline.
    # Rendered through `tpl`, so Helm expressions are allowed.
    webhooks:
      - name: load-test
        type: rollout
        url: http://flagger-loadtester.flagger-system/
        metadata:
          # Must hit a path the application actually measures. Health
          # endpoints are normally excluded from the metrics middleware, so
          # a load generator pointed at /healthz produces traffic no gate
          # can see — the canary then halts on "no values found" and rolls
          # back a healthy release. Observed, not theorised.
          # Fully qualified. The load tester runs in flagger-system and the
          # service lives in the application namespace, so a bare name does
          # not resolve — hey fails every request, no traffic reaches the
          # canary, and the gates halt on "no values found". The load
          # generator failing looks exactly like the metrics being wrong.
          cmd: >-
            hey -z 1m -q 5 -c 2 -m POST -T application/json
            -d '{"query":"canary probe"}'
            http://{{ .Values.target.name }}-canary.{{ .Release.Namespace }}:{{ .Values.target.service.port }}/ask

  # App-specific Flagger MetricTemplates, rendered verbatim. The chart stays
  # generic by knowing nothing about them; the consumer ships its own and
  # names them in analysis.metrics above.
  metricTemplates: []
    # - name: rag-refusal-rate
    #   query: |
    #     sum(rate(rag_answers_total{outcome="refused"}[{{ "{{ interval }}" }}]))
    #       / sum(rate(rag_answers_total[{{ "{{ interval }}" }}])) * 100


# ─────────────────────────────────────────────────────────────────────────────
# Scaling and disruption
# ─────────────────────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior: {}

podDisruption:
  enabled: false
  minAvailable: 1


# ─────────────────────────────────────────────────────────────────────────────
# Observability
# ─────────────────────────────────────────────────────────────────────────────
podMonitor:
  # A PodMonitor rather than a ServiceMonitor: under Flagger the Service set
  # churns across a rollout (apex / -primary / -canary), while pod labels stay
  # stable, and the canary's own metrics have to stay distinguishable.
  enabled: true
  port: http              # container port NAME, not number
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s
  labels: {}
