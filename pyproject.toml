[project]
name = "jenie"
version = "0.1.0"
description = "Jenie Helpdesk AI — RAG service over an operations knowledge base"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-postgres>=0.4",
    "llama-index-embeddings-openai-like>=0.1",
    "llama-index-llms-openai-like>=0.3",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=7.0",
    "python-json-logger>=3.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres]>=4.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jenie"]
