{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service-policy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-policy.labels" . | nindent 4 }}
spec:
  # Selects pods by label rather than by workload name, so it covers the
  # -primary and -canary pods Flagger creates without naming them. Flagger
  # copies the source Deployment's labels onto both.
  podSelector:
    matchLabels:
      {{- toYaml .Values.target.selector | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range .Values.networkPolicy.allowFrom }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- end }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.allowDNS }}
    # Without this, a default-deny egress policy breaks DNS before it breaks
    # anything you were trying to block, and every failure looks like a
    # resolution error.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- range .Values.networkPolicy.allowTo }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .podSelector | nindent 14 }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
